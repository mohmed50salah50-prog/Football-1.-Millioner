name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate project (unzip if needed)
        run: |
          if [ -f package.json ] && [ -f capacitor.config.json ]; then
            P=.
          else
            mkdir -p _unz
            for z in *.zip; do [ -f "$z" ] && unzip -o -q "$z" -d _unz; done
            CFGF=$(find _unz -name capacitor.config.json -not -path "*/node_modules/*" | head -1)
            [ -n "$CFGF" ] || { echo "Project not found: upload the zip"; exit 1; }
            P=$(dirname "$CFGF")
          fi
          echo "Project dir: $P"
          echo "P=$P" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        working-directory: ${{ env.P }}
        run: npm install

      - name: Copy Arabic font (Cairo)
        working-directory: ${{ env.P }}
        run: |
          mkdir -p www/fonts
          cp node_modules/@fontsource/cairo/files/cairo-arabic-700-normal.woff2 www/fonts/
          cp node_modules/@fontsource/cairo/files/cairo-arabic-900-normal.woff2 www/fonts/

      - name: Refresh questions.json
        working-directory: ${{ env.P }}
        run: node scripts/build-questions.js

      - name: Create splash image
        working-directory: ${{ env.P }}
        run: |
          pip install pillow
          python3 - <<'PY'
          from PIL import Image
          icon = Image.open("assets/icon.png").convert("RGB").resize((1100, 1100))
          bg = Image.new("RGB", (2732, 2732), (3, 8, 24))
          bg.paste(icon, ((2732-1100)//2, (2732-1100)//2))
          bg.save("assets/splash.png")
          bg.save("assets/splash-dark.png")
          PY

      - name: Add Android platform
        working-directory: ${{ env.P }}
        run: npx cap add android

      - name: Generate icons and splash
        working-directory: ${{ env.P }}
        run: npx capacitor-assets generate --android --iconBackgroundColor "#030818" --splashBackgroundColor "#030818"

      - name: Lock portrait orientation
        working-directory: ${{ env.P }}
        run: sed -i 's/<activity /<activity android:screenOrientation="portrait" /' android/app/src/main/AndroidManifest.xml

      - name: Sync web assets
        working-directory: ${{ env.P }}
        run: npx cap sync android

      - name: Build debug APK
        working-directory: ${{ env.P }}/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: football-millionaire-apk
          path: ${{ env.P }}/android/app/build/outputs/apk/debug/app-debug.apk
